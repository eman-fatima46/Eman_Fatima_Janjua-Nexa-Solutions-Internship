<header>

  <h1>
    Library Management System
  </h1>

  <nav>

    <a routerLink="/books">
      Books
    </a>

    @if (
      authService.isLoggedIn()
    ) {

      <span>
        Logged in as
        <strong>
          {{ authService.getUsername() }}
        </strong>
      </span>

      <button
        type="button"
        (click)="logout()"
      >
        Logout
      </button>

    }
    @else {

      <a routerLink="/login">
        Login
      </a>

    }

  </nav>

</header>

<main>

  <router-outlet />

</main>
