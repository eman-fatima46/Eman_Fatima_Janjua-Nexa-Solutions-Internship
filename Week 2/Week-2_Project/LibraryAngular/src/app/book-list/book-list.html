<h2>Library Books</h2>

@if (books.length > 0) {

  <table>

    <thead>

      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>

    </thead>

    <tbody>

      @for (book of books; track book.id) {

        <tr>

          <td>
            {{ book.id }}
          </td>

          <td>
            {{ book.title }}
          </td>

          <td>
            {{ book.author }}
          </td>

          <td>
            {{ book.category }}
          </td>

          <td>

            <a
              [routerLink]="[
                '/books/edit',
                book.id
              ]">

              Edit

            </a>

            <button
              type="button"
              (click)="deleteBook(book.id)">

              Delete

            </button>

          </td>

        </tr>

      }

    </tbody>

  </table>

}
@else {

  <p>
    No books available.
  </p>

}
